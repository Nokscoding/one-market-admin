name: One Market Admin integration validation

on:
  push:
    branches:
      - chatgpt/integration-20260918-admin

permissions:
  contents: write

jobs:
  integrate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and apply patch
        shell: bash
        run: |
          cat .patches/admin-00.z .patches/admin-01.z .patches/admin-02.z .patches/admin-03.z .patches/admin-04.z > /tmp/one-market-admin.z
          python3 - <<'PY'
          import zlib
          from pathlib import Path
          data = Path('/tmp/one-market-admin.z').read_bytes()
          Path('/tmp/one-market-admin.patch').write_bytes(zlib.decompress(data))
          PY
          git apply --check /tmp/one-market-admin.patch
          git apply /tmp/one-market-admin.patch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Replace transport files with integrated source
        shell: bash
        run: |
          rm -rf .patches
          rm -f .github/workflows/one-market-integration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: integrate One Market admin corrections"
          git push origin "HEAD:$GITHUB_REF_NAME"
